spring.application.name=calculadora-maluca
server.port=8080

# Banco H2 em arquivo (persistente em ./dados)
spring.datasource.url=jdbc:h2:file:./dados/calculadora;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console do H2 em http://localhost:8080/h2-console (só para desenvolvimento)
spring.h2.console.enabled=true

# Origens liberadas no CORS (separadas por vírgula)
app.cors.origens=http://localhost:5173,http://127.0.0.1:5173
